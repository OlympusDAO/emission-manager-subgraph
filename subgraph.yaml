specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EmissionManager
    network: mainnet
    source:
      address: '0x50f441a3387625bDA8B8081cE3fd6C04CC48C0A2'
      abi: EmissionManager
      startBlock: 21216654
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Contract
        - Token
        - Activation
        - Deactivation
        - BackingChange
        - BackingUpdate
        - BaseRateChange
        - MinimumPremiumChange
        - BondContractsSet
        - SaleCreated
        - VestingPeriodChange
        - RestartTimeframeChange
      abis:
        - name: EmissionManager
          file: ./abis/EmissionManager.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Activated()
          handler: handleActivated
        - event: Deactivated()
          handler: handleDeactivated
        - event: BackingChanged(uint256)
          handler: handleBackingChanged
        - event: BackingUpdated(uint256,uint256,uint256)
          handler: handleBackingUpdated
        - event: BaseRateChanged(uint256,uint48,bool)
          handler: handleBaseRateChanged
        - event: MinimumPremiumChanged(uint256)
          handler: handleMinimumPremiumChanged
        - event: BondContractsSet(address,address)
          handler: handleBondContractsSet
        - event: SaleCreated(uint256,uint256)
          handler: handleSaleCreated
        - event: VestingPeriodChanged(uint48)
          handler: handleVestingPeriodChanged
        - event: RestartTimeframeChanged(uint48)
          handler: handleRestartTimeframeChanged
      file: ./src/handlers/emission-manager-handlers.ts
